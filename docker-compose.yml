services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vbsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - devpg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Object storage for profile photos. Opt-in, because VBS runs perfectly well
  # without it - unset the STORAGE_* variables and photos are stored inline as
  # they always were. Behind a profile so `docker compose up` stays two
  # services for anyone who does not want a third:
  #
  #   docker compose --profile storage up -d
  #
  # Versity S3 Gateway (Apache-2.0): one S3 port, refuses to start without
  # credentials, objects as plain files under /data/<bucket>/. It replaced
  # MinIO when MinIO stopped publishing images anyone can pull (quay.io and
  # Docker Hub both answer 401). Region "auto" to match STORAGE_REGION's
  # default. Pinned: a floating tag is how a vendor's decision broke this.
  storage:
    image: versity/versitygw:v1.9.0
    profiles: ["storage"]
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: vbs-app
      ROOT_SECRET_KEY: dev-insecure-storage-secret-change-me
      VGW_REGION: auto
      VGW_HEALTH: /health
      VGW_QUIET: "true"
    ports:
      - "9000:7070"
    volumes:
      - storage_data:/data
    depends_on:
      storage-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7070/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # A bucket is a top-level directory on the gateway's volume; nothing else
  # creates vbs-uploads.
  storage-createbucket:
    image: versity/versitygw:v1.9.0
    profiles: ["storage"]
    entrypoint: ["sh", "-c", "mkdir -p /data/vbs-uploads && echo 'bucket ready: vbs-uploads'"]
    volumes:
      - storage_data:/data
    network_mode: none
    restart: "no"

volumes:
  devpg:
  redis_data:
  storage_data:
