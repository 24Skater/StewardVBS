services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vbsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - devpg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Object storage for profile photos. Opt-in, because VBS runs perfectly well
  # without it - unset the STORAGE_* variables and photos are stored inline as
  # they always were. Behind a profile so `docker compose up` stays two
  # services for anyone who does not want a third:
  #
  #   docker compose --profile storage up -d
  #
  # Pinned to a RELEASE tag, and pulled from quay.io rather than Docker Hub.
  # MinIO left Docker Hub, which turned a working build red in two other
  # Steward repositories with no commit to blame - a floating :latest is what
  # let a vendor's decision break them.
  storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  devpg:
  redis_data:
  storage_data:
